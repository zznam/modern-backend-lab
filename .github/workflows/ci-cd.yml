name: Modern Backend CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ========================================================
  # Stage 1: Quality, Lint & Security Vulnerability Audit
  # ========================================================
  quality-and-security:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Security Vulnerability Audit (OWASP)
        run: npm audit --audit-level=high

  # ========================================================
  # Stage 2: Automated Testing (Unit, Integration, Contract)
  # ========================================================
  test:
    name: Automated Test Suite
    needs: quality-and-security
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lab_user
          POSTGRES_PASSWORD: lab_password
          POSTGRES_DB: mastery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_user -d mastery_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Go (Companion Concurrency Suite)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suite (Unit, Integration, Contract)
        run: npm run test
        env:
          TEST_DATABASE_URL: postgresql://lab_user:lab_password@127.0.0.1:5432/mastery_test
          TEST_REDIS_URL: redis://127.0.0.1:6379

      - name: Run Go Concurrency Benchmark
        run: npm run bench:go

  browser-e2e:
    name: Browser E2E (desktop and mobile)
    needs: quality-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real browser E2E suite
        run: npm run test:e2e

      - name: Upload browser report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ========================================================
  # Stage 3: Containerization & Security Scanning
  # ========================================================
  build-container:
    name: Build & Containerize
    needs: [test, browser-e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: modern-backend-lab:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # Stage 4: Progressive Delivery (Canary / Blue-Green Simulation)
  # ========================================================
  deploy-canary:
    name: Progressive Canary Deployment
    needs: build-container
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Canary Pods (10% Traffic Weight)
        run: |
          echo "🚀 Deploying Canary version ${{ github.sha }} to production cluster..."
          echo "Routing 10% of ingress traffic to Canary deployment via Envoy/Nginx..."
          sleep 2

      - name: Monitor Canary Observability Metrics (Prometheus Error Rate & p99 Latency)
        run: |
          echo "🔍 Checking Prometheus error_rate < 0.01% and p99_latency < 100ms..."
          echo "✓ Canary health check PASSED. Zero errors detected."

      - name: Full Traffic Shift (100% Rollout)
        run: |
          echo "🎉 Shifting 100% of production traffic to new release ${{ github.sha }}."
          echo "Draining old revision pods cleanly with zero downtime."
