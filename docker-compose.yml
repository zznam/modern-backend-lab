services:
  # 1. Main Application Service
  backend-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modern-backend-lab
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://lab_user:lab_password@postgres:5432/mastery_db
      - REDIS_URL=redis://redis:6379
      - JAEGER_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network

  # 2. Relational Database: PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: lab-postgres
    restart: always
    environment:
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: lab_password
      POSTGRES_DB: mastery_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_user -d mastery_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  # 3. In-Memory Data Store: Redis 7
  redis:
    image: redis:7-alpine
    container_name: lab-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend-network

  # 4. Metrics Scraper: Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: lab-prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend-network

  # 5. Metrics Dashboards: Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: lab-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - backend-network

  # 6. Distributed Tracing: Jaeger (OTLP-native)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: lab-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4318:4318"   # OTLP HTTP collector endpoint
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
