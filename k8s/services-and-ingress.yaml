apiVersion: v1
kind: Service
metadata:
  name: modern-backend-lab-svc
  labels:
    app: modern-backend-lab
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    app: modern-backend-lab
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: modern-backend-lab-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: modern-backend-lab
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-lab-config
data:
  NODE_ENV: "production"
  PORT: "4000"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-lab-secrets
type: Opaque
stringData:
  JWT_SECRET: "k8s-production-super-secret-key-32-chars-long"
  DATABASE_URL: "postgresql://user:pass@postgres-svc:5432/production_db"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: modern-backend-lab-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.modern-backend.internal
      secretName: backend-tls-cert
  rules:
    - host: api.modern-backend.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: modern-backend-lab-svc
                port:
                  number: 80
